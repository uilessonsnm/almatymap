<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алматы: Город, который помнит</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e5e3df;
        }

        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Верхняя панель фильтров */
        .filter-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            gap: 8px;
            backdrop-filter: blur(5px);
            max-width: 95vw;
            overflow-x: auto;
        }

        .filter-btn {
            border: none;
            background: transparent;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .filter-btn:hover {
            background: #f0f0f0;
            color: #111;
        }

        .filter-btn.active {
            background: #007bff;
            color: #fff;
        }

        /* Маркеры карт */
        .custom-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #007bff;
            color: white;
            font-weight: bold;
            font-size: 14px;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .custom-pin:hover {
            transform: scale(1.2);
            background: #0056b3;
        }

        /* БОКОВАЯ ПАНЕЛЬ И АДАПТИВ ДЛЯ МОБИЛЬНЫХ */
        .side-panel {
            position: absolute;
            top: 80px;
            left: 20px;
            width: 420px;
            max-height: calc(100vh - 100px);
            background: rgba(255, 255, 255, 0.98);
            z-index: 1000;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.25);
            padding: 20px;
            overflow-y: auto;
            display: none;
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }

        .side-panel.active {
            display: block;
        }

        @media (max-width: 600px) {
            .side-panel {
                top: auto;
                bottom: 0;
                left: 0;
                width: 100vw;
                max-height: 70vh;
                border-radius: 20px 20px 0 0;
                padding: 16px;
            }
        }

        .close-btn {
            position: absolute;
            top: 14px;
            right: 16px;
            background: #e9ecef;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: #dee2e6;
            color: #000;
        }

        .popup-title {
            font-size: 19px;
            font-weight: 800;
            color: #111;
            margin-bottom: 4px;
            padding-right: 30px;
            line-height: 1.3;
        }

        .popup-meta {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        .popup-year {
            font-size: 11px;
            font-weight: 700;
            background: #007bff;
            color: #fff;
            padding: 3px 10px;
            border-radius: 12px;
        }

        .popup-address {
            font-size: 11px;
            color: #6c757d;
            font-weight: 500;
        }

        .photo-comparison {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .photo-box {
            flex: 1;
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: #e0e0e0;
            height: 140px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-label {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .popup-section {
            font-size: 13px;
            color: #2b2b2b;
            margin-top: 10px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid #007bff;
            line-height: 1.5;
        }

        .popup-section strong {
            color: #007bff;
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .popup-fact {
            background: #fff3cd;
            border-left-color: #ffc107;
            color: #856404;
        }

        .popup-fact strong {
            color: #856404;
        }

        .popup-history {
            background: #e8f4f8;
            border-left-color: #17a2b8;
            color: #114b5f;
        }

        .popup-history strong {
            color: #17a2b8;
        }
    </style>
</head>

                iconAnchor: [16, 16]
            });

            const marker = L.marker(point.coords, { icon: icon }).addTo(map);
            marker.era = point.era;

            marker.on('click', function() {
                map.flyTo(point.coords, 15, { animate: true, duration: 1.2 });

                const content = `
                    <div class="popup-title">${point.id}. ${point.name}</div>
                    <div class="popup-meta">
                        <span class="popup-year">${point.year}</span>
                        <span class="popup-address">📍 ${point.address}</span>
                    </div>
                    
                    <div class="photo-comparison">
                        <div class="photo-box">
                            <img src="${point.imgOld}" alt="Архивное фото">
                            <span class="photo-label">Раньше</span>
                        </div>
                        <div class="photo-box">
                            <img src="${point.imgNew}" alt="Современное фото">
                            <span class="photo-label">Сейчас</span>
                        </div>
                    </div>

                    <div class="popup-section">
                        <strong>Зачем создан?</strong>
                        ${point.purpose}
                    </div>

                    <div class="popup-section">
                        <strong>Что происходило?</strong>
                        ${point.events}
                    </div>

                    <div class="popup-section">
                        <strong>Почему важен?</strong>
                        ${point.importance}
                    </div>

                    <div class="popup-section popup-fact">
                        <strong>Интересный факт:</strong>
                        ${point.fact}
                    </div>

                    <div class="popup-section popup-history">
                        <strong>Для летописи:</strong>
                        ${point.chronicle}
                    </div>
                `;

                document.getElementById('panelContent').innerHTML = content;
                document.getElementById('sidePanel').classList.add('active');
            });

            markers.push(marker);
        });

        function closePanel() {
            document.getElementById('sidePanel').classList.remove('active');
        }

        function filterEra(era) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            markers.forEach(marker => {
                if (era === 'all' || marker.era === era) {
                    map.addLayer(marker);
                } else {
                    map.removeLayer(marker);
                }
            });
            closePanel();
        }
    </script>
</body>
</html>
